spring:
  application:
    name: neo-00

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3326/neo_00?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppass}
    hikari:
      # ELEVEN SERVICES SHARE ONE DATABASE, CEILING 60 — see the fuller note in a module's
      # application.yml, and infra/README.md § Connection budget for the arithmetic.
      #
      # The orchestrator gets more than a module because it writes an event for every
      # dispatch, ack and answer of every journey — ten times the traffic of any one module.
      # 10 × 3 + 5 = 35 of the 60.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

orchestrator:
  # The command label sent to every service.
  command: process-application
  # How long to wait after a callback before dispatching the next service. This is the
  # visible rhythm of the board.
  step-delay: ${STEP_DELAY:1s}
  # A service that has not called back within this is given up on: the step is logged as
  # TIMEOUT and the application ends FAILED. Without it one dropped callback wedges a
  # journey forever.
  callback-timeout: ${CALLBACK_TIMEOUT:30s}
  sweep-interval-ms: ${SWEEP_INTERVAL_MS:5000}

  # DEMO STEPPING. Off, and normally left off: applications walk the journey by themselves.
  #
  # Turned on — here, or from the switch in the backoffice — no step is dispatched until
  # someone presses Proceed on the board, INCLUDING the first, so an eight-step journey is
  # eight clicks. It exists so the journey can be narrated in front of an audience.
  #
  # The button releases a dispatch; it never answers on a module's behalf. Every service
  # still does its own work and reports its own status. Turning the toggle back off releases
  # everything currently parked.
  demo-stepping: ${DEMO_STEPPING:false}

  # THE ONE STEP THAT WAITS FOR A PERSON. The agreement service generates a credit agreement and
  # sends it for signature; until the customer signs it there is nothing for it to decide, so it
  # reports progress rather than an outcome and the journey holds at that step.
  #
  # This is NOT a special case in the saga — any service reporting IN_PROGRESS already means "the
  # journey waits". All this names is whose wait is a customer's, and therefore gets a longer
  # rope than callback-timeout, which is how long a MODULE may think. The rope is still finite:
  # an unbounded wait is a journey that sits IN_PROGRESS for the life of the database.
  #
  # NOTE the module's own expiry clock is measured in days, so for anything past this timeout the
  # orchestrator gives up first and the module's case is left PENDING. Ours is the clock that
  # decides — see api-contract.md §7.
  signature:
    service-id: ${SIGNATURE_SERVICE_ID:neo06}
    timeout: ${SIGNATURE_TIMEOUT:10m}

  # THE SUPPORT DESK. Addressed, not sequenced — neo09 is an analytical module and must NOT be
  # added to services[] below, or the saga would dispatch to it and wait for a decision it has no
  # business making. A customer opens a case through the orchestrator because that is the only
  # door, and this is the only call that goes through it.
  support:
    base-url: ${SERVICE_09_URL:http://localhost:9009}

  # WHO OWNS THE PRODUCT CATALOGUE. Not us: the customer's product picker and the "how much
  # would you like" bound are read live from this service, because it is the one that rejects an
  # application naming a code or a limit it does not hold. See ProductCatalogue.
  catalogue:
    service-id: ${CATALOGUE_SERVICE_ID:neo01}

  generator:
    # OFF at boot on purpose: the orchestrator dispatches to services that call back to
    # the orchestrator, so a stack coming up all at once would fire at containers that
    # are not listening yet. Turn it on from the UI.
    enabled: ${GENERATOR_ENABLED:false}
    interval-ms: ${GENERATOR_INTERVAL_MS:5000}
    tick-ms: 1000
    # Seed 42 — course convention. Same applicants and products every run.
    seed: ${GENERATOR_SEED:42}

  # THE JOURNEY. Order is the sequence a customer's application travels through; the names
  # are the module topics from the capstone spec, and each module is one student team.
  #
  # serviceId is what a module sends on its status update — note it has no hyphen, unlike
  # the repository name (neo-01 → neo01). That mismatch is intentional.
  #
  # Base URLs default to localhost:900N, which is what you want when the orchestrator runs
  # in your IDE and the modules run in compose. In the system stack and on AWS every one of
  # them is overridden by environment (compose service names / Cloud Map DNS).
  #
  # EIGHT steps, not ten. neo09 (Customer Support) and neo10 (Portfolio & Regulatory
  # Analytics) are the two ANALYTICAL modules: in the spec they observe the journey rather
  # than sit in it, so they were removed from the sequence on 2026-07-29. They still build,
  # deploy and serve their own UIs — the orchestrator simply never dispatches to them, and
  # they no longer appear in GET /api/v1/services. Their data comes from the journey read
  # API instead (api-contract.md §5).
  #
  # The journey therefore COMPLETES when step 8 accepts. Nothing in the code counts to ten:
  # SagaStore uses registry.size(), so this list is the only place the length is decided.
  services:
    - { step: 1,  serviceId: neo01, name: "Application Verification",          base-url: "${SERVICE_01_URL:http://localhost:9001}" }
    - { step: 2,  serviceId: neo02, name: "Customer Policy",                   base-url: "${SERVICE_02_URL:http://localhost:9002}" }
    - { step: 3,  serviceId: neo03, name: "Identity Verification (KYC)",       base-url: "${SERVICE_03_URL:http://localhost:9003}" }
    - { step: 4,  serviceId: neo04, name: "Fraud & AML Screening",             base-url: "${SERVICE_04_URL:http://localhost:9004}" }
    - { step: 5,  serviceId: neo05, name: "Credit Decisioning",                base-url: "${SERVICE_05_URL:http://localhost:9005}" }
    - { step: 6,  serviceId: neo06, name: "Agreement Management",              base-url: "${SERVICE_06_URL:http://localhost:9006}" }
    - { step: 7,  serviceId: neo07, name: "Card Account Setup",                base-url: "${SERVICE_07_URL:http://localhost:9007}" }
    - { step: 8,  serviceId: neo08, name: "Card Issuing",                      base-url: "${SERVICE_08_URL:http://localhost:9008}" }

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    liquibase: INFO
