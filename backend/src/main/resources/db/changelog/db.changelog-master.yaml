# Liquibase owns neo_00. Add one file per change set and include it in order;
# never edit an applied change set.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-application.yaml
  - include:
      file: db/changelog/changes/002-add-pending-step.yaml
  - include:
      file: db/changelog/changes/003-add-outputs.yaml
  - include:
      file: db/changelog/changes/004-add-awaiting-signature.yaml
  - include:
      file: db/changelog/changes/005-add-customer.yaml
