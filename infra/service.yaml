AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  One neobank SERVICE, standalone: a Fargate task holding a backend and its nginx front end,
  an ALB target group + path rule, and a Cloud Map DNS name. Deployed by ITS OWN repo's
  pipeline as neobank-<env>-<ServiceName>. The orchestrator is a service too, differing only
  in the environment variables the Role parameter switches on.

  The shared wiring (cluster, subnets, security group, listener, namespace, IAM roles, log
  group, secrets) is pulled from the platform stack's Exports via Fn::ImportValue — the
  pipeline never passes a subnet ARN. The only two platform values that change when a
  resource is replaced (the RDS endpoint and the ALB DNS) are passed as parameters, resolved
  by the pipeline from the platform's SSM parameters — so replacing the ALB or RDS carries no
  cross-stack import lock.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]

  Role:
    Type: String
    AllowedValues: [orchestrator, module]
    Description: Which set of environment variables this service gets. Everything else is identical.

  ServiceName:
    Type: String
    Description: >-
      ECS service name AND Cloud Map DNS label. How the orchestrator finds a module
      (http://<ServiceName>.<namespace>:8080) and how a module calls back. Also the last
      segment of the stack name (neobank-<env>-<ServiceName>).

  PathPrefix:
    Type: String
    Default: ""
    Description: >-
      URL prefix this service is served under, no trailing slash (e.g. /neo-01). Empty
      for the orchestrator, which owns the ALB root. MUST match the APP_BASE_PATH the
      front-end image was built with — Vite bakes asset URLs at build time.

  ListenerRulePriority:
    Type: Number
    Description: >-
      ALB rules evaluate lowest-first, and the number is UNIQUE across every service on the
      shared listener — a collision fails the second deploy. Reserved: neo-01=10, neo-02=20,
      … neo-10=100; orchestrator=50000 (its /* catch-all must be checked last, or it
      swallows every module's UI).

  BackendImage:
    Type: String
    Description: Pinned to an immutable @sha256 digest by the pipeline, so a build rolls the task def.
  FrontendImage:
    Type: String

  DesiredCount:
    Type: Number
    Default: 1
    Description: Set to 0 to park this service. On Fargate, parked costs nothing.

  DbName:
    Type: String
    Description: The one schema this service owns. Created by its own deploy; no service reads another's.

  # --- the two replaceable platform values, resolved from SSM by the pipeline ---
  DbEndpoint:
    Type: String
    Description: RDS address. Pipeline reads /neobank/<env>/db-endpoint and passes it here.
  AlbDnsName:
    Type: String
    Description: ALB host, for the CORS allow-list. Pipeline reads /neobank/<env>/alb-dns.

  # --- orchestrator-only: the saga, one slot per module ---
  #
  # Ten slots, thirty parameters, listed rather than derived. They COULD be computed — every
  # serviceId is neoNN and every base URL is http://neo-NN.<namespace>:8080 — but then
  # "which modules does the journey call, in what order, under what name?" would have no
  # single place to read the answer. infra/env/<env>.params is that place, and a slot is
  # dropped from an environment by blanking its three lines, not by editing this template.
  #
  # A blank Step*ServiceId still produces its env vars; the orchestrator ignores a slot with
  # no serviceId, so a short list is safe.
  Step1ServiceId:  { Type: String, Default: "" }
  Step1Name:       { Type: String, Default: "" }
  Step1BaseUrl:    { Type: String, Default: "" }
  Step2ServiceId:  { Type: String, Default: "" }
  Step2Name:       { Type: String, Default: "" }
  Step2BaseUrl:    { Type: String, Default: "" }
  Step3ServiceId:  { Type: String, Default: "" }
  Step3Name:       { Type: String, Default: "" }
  Step3BaseUrl:    { Type: String, Default: "" }
  Step4ServiceId:  { Type: String, Default: "" }
  Step4Name:       { Type: String, Default: "" }
  Step4BaseUrl:    { Type: String, Default: "" }
  Step5ServiceId:  { Type: String, Default: "" }
  Step5Name:       { Type: String, Default: "" }
  Step5BaseUrl:    { Type: String, Default: "" }
  Step6ServiceId:  { Type: String, Default: "" }
  Step6Name:       { Type: String, Default: "" }
  Step6BaseUrl:    { Type: String, Default: "" }
  Step7ServiceId:  { Type: String, Default: "" }
  Step7Name:       { Type: String, Default: "" }
  Step7BaseUrl:    { Type: String, Default: "" }
  Step8ServiceId:  { Type: String, Default: "" }
  Step8Name:       { Type: String, Default: "" }
  Step8BaseUrl:    { Type: String, Default: "" }
  # Eight steps, not ten: neo09 and neo10 are analytical modules and left the sequence on
  # 2026-07-29. They still deploy and serve their own UIs — the orchestrator just never
  # dispatches to them. See application.yml.

  # --- module-only ---
  ServiceId:
    Type: String
    Default: ""
    Description: What this module puts on its status updates. Deliberately not the repo name.
  DisplayName:
    Type: String
    Default: ""
  Domain:
    Type: String
    Default: ""
    Description: >-
      The BIAN domain this module owns (verification, policy, kyc, …), served on /info. A
      parameter and not a literal: ten repos share this template, and a hardcoded domain
      means nine of them lie about what they are.
  Team:
    Type: String
    Default: ""
    Description: Whose module this is — shown in the UI's identity box.
  MockedDependencies:
    Type: String
    Default: ""
    Description: >-
      Comma-separated external systems this module fakes — deliverable #4's register, served
      live on /info so it cannot go stale the way a document does.

Conditions:
  IsOrchestrator: !Equals [!Ref Role, orchestrator]
  HasPathPrefix: !Not [!Equals [!Ref PathPrefix, ""]]

Resources:

  # --- how the browser reaches this service: one target group, one path rule ---

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue
        Fn::Sub: "neobank-${EnvironmentName}-VpcId"
      Port: 80
      Protocol: HTTP
      TargetType: ip           # awsvpc: targets are task ENIs, not instances
      # The health check hits the container DIRECTLY and does NOT pass through the listener
      # rules, so it must use the same prefix nginx actually serves under. A check for
      # /health against an nginx serving /neo-01/health returns 404, ECS kills the task,
      # and the deploy hangs at services-stable looking like a mystery. This line is the cure.
      HealthCheckPath: !Sub "${PathPrefix}/health"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "neobank-${EnvironmentName}-ListenerArn"
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: !If
              - HasPathPrefix
              - [!Ref PathPrefix, !Sub "${PathPrefix}/*"]
              - ["/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- how the other slots reach this one: a private DNS name, the cloud twin of Compose's
  #     service names. The orchestrator dispatches to http://neo-01.neobank-dev.local:8080
  #     for the same reason it dispatches to http://neo-01:8080 on a laptop. ---

  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref ServiceName
      NamespaceId: !ImportValue
        Fn::Sub: "neobank-${EnvironmentName}-NamespaceId"
      DnsConfig:
        NamespaceId: !ImportValue
          Fn::Sub: "neobank-${EnvironmentName}-NamespaceId"
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - { Type: A, TTL: 15 }
      HealthCheckCustomConfig:
        FailureThreshold: 1

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "neobank-${EnvironmentName}-${ServiceName}"
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "neobank-${EnvironmentName}-ExecRoleArn"
      TaskRoleArn: !ImportValue
        Fn::Sub: "neobank-${EnvironmentName}-TaskRoleArn"
      ContainerDefinitions:

        # The team's service. Same image, same env vars as on a laptop.
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          # A hard limit, because the JVM sizes its heap from the CONTAINER limit. Without it
          # the JVM reads the task's full 1024 MB, takes 70%, and leaves nginx nothing.
          Memory: 768
          RepositoryCredentials:
            CredentialsParameter: !ImportValue
              Fn::Sub: "neobank-${EnvironmentName}-GhcrSecretArn"
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
          Environment: !If
            - IsOrchestrator
            - - { Name: JAVA_TOOL_OPTIONS, Value: "-XX:MaxRAMPercentage=70" }
              - { Name: DB_URL, Value: !Sub "jdbc:mysql://${DbEndpoint}:3306/${DbName}" }
              - { Name: DB_USERNAME, Value: appuser }
              - { Name: STEP_DELAY, Value: "1s" }
              - { Name: CALLBACK_TIMEOUT, Value: "30s" }
              - { Name: GENERATOR_ENABLED, Value: "false" }
              # The saga. Spring Boot does NOT merge collections across property sources, so
              # the highest-precedence source that supplies orchestrator.services supplies
              # ALL of it — these thirty variables replace application.yml's list entirely
              # rather than adding to it. Index is 0-based; `step` is 1-based. Check it
              # worked: GET /api/v1/services must return ten rows.
              - { Name: ORCHESTRATOR_SERVICES_0_STEP, Value: "1" }
              - { Name: ORCHESTRATOR_SERVICES_0_SERVICEID, Value: !Ref Step1ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_0_NAME, Value: !Ref Step1Name }
              - { Name: ORCHESTRATOR_SERVICES_0_BASEURL, Value: !Ref Step1BaseUrl }
              - { Name: ORCHESTRATOR_SERVICES_1_STEP, Value: "2" }
              - { Name: ORCHESTRATOR_SERVICES_1_SERVICEID, Value: !Ref Step2ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_1_NAME, Value: !Ref Step2Name }
              - { Name: ORCHESTRATOR_SERVICES_1_BASEURL, Value: !Ref Step2BaseUrl }
              - { Name: ORCHESTRATOR_SERVICES_2_STEP, Value: "3" }
              - { Name: ORCHESTRATOR_SERVICES_2_SERVICEID, Value: !Ref Step3ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_2_NAME, Value: !Ref Step3Name }
              - { Name: ORCHESTRATOR_SERVICES_2_BASEURL, Value: !Ref Step3BaseUrl }
              - { Name: ORCHESTRATOR_SERVICES_3_STEP, Value: "4" }
              - { Name: ORCHESTRATOR_SERVICES_3_SERVICEID, Value: !Ref Step4ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_3_NAME, Value: !Ref Step4Name }
              - { Name: ORCHESTRATOR_SERVICES_3_BASEURL, Value: !Ref Step4BaseUrl }
              - { Name: ORCHESTRATOR_SERVICES_4_STEP, Value: "5" }
              - { Name: ORCHESTRATOR_SERVICES_4_SERVICEID, Value: !Ref Step5ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_4_NAME, Value: !Ref Step5Name }
              - { Name: ORCHESTRATOR_SERVICES_4_BASEURL, Value: !Ref Step5BaseUrl }
              - { Name: ORCHESTRATOR_SERVICES_5_STEP, Value: "6" }
              - { Name: ORCHESTRATOR_SERVICES_5_SERVICEID, Value: !Ref Step6ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_5_NAME, Value: !Ref Step6Name }
              - { Name: ORCHESTRATOR_SERVICES_5_BASEURL, Value: !Ref Step6BaseUrl }
              - { Name: ORCHESTRATOR_SERVICES_6_STEP, Value: "7" }
              - { Name: ORCHESTRATOR_SERVICES_6_SERVICEID, Value: !Ref Step7ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_6_NAME, Value: !Ref Step7Name }
              - { Name: ORCHESTRATOR_SERVICES_6_BASEURL, Value: !Ref Step7BaseUrl }
              - { Name: ORCHESTRATOR_SERVICES_7_STEP, Value: "8" }
              - { Name: ORCHESTRATOR_SERVICES_7_SERVICEID, Value: !Ref Step8ServiceId }
              - { Name: ORCHESTRATOR_SERVICES_7_NAME, Value: !Ref Step8Name }
              - { Name: ORCHESTRATOR_SERVICES_7_BASEURL, Value: !Ref Step8BaseUrl }
              - { Name: CORS_ALLOWED_ORIGIN_PATTERNS, Value: !Sub "http://${AlbDnsName},http://localhost:*" }
            - - { Name: JAVA_TOOL_OPTIONS, Value: "-XX:MaxRAMPercentage=70" }
              - { Name: DB_URL, Value: !Sub "jdbc:mysql://${DbEndpoint}:3306/${DbName}" }
              - { Name: DB_USERNAME, Value: appuser }
              - { Name: SERVICE_ID, Value: !Ref ServiceId }
              - { Name: SERVICE_NAME, Value: !Ref DisplayName }
              - Name: ORCHESTRATOR_URL
                Value: !Sub
                  - "http://orchestrator.${NsName}:8080"
                  - NsName: !ImportValue
                      Fn::Sub: "neobank-${EnvironmentName}-NamespaceName"
              # No decision knobs: a module's answer comes from the code a team writes in
              # ApplicationService, not from a weight set out here. The skeleton's placeholder
              # accepts everything, so an unmodified module completes every journey — which
              # means one that does NOT complete is genuinely broken, not unlucky.
              - { Name: SERVICE_DOMAIN, Value: !Ref Domain }
              - { Name: SERVICE_TEAM, Value: !Ref Team }
              - { Name: MOCKED_DEPENDENCIES, Value: !Ref MockedDependencies }
              - { Name: CORS_ALLOWED_ORIGIN_PATTERNS, Value: !Sub "http://${AlbDnsName},http://localhost:*" }
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${SecretArn}:password::"
                - SecretArn: !ImportValue
                    Fn::Sub: "neobank-${EnvironmentName}-DbSecretArn"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: "neobank-${EnvironmentName}-LogGroup"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref ServiceName

        # The operator UI. In awsvpc both containers share one network namespace, so this
        # proxies to 127.0.0.1 — no DNS, nothing to go stale.
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          Memory: 128
          RepositoryCredentials:
            CredentialsParameter: !ImportValue
              Fn::Sub: "neobank-${EnvironmentName}-GhcrSecretArn"
          PortMappings:
            - { ContainerPort: 80, Protocol: tcp }
          Environment:
            - { Name: BACKEND_HOST, Value: "127.0.0.1" }
            - { Name: BASE_PATH, Value: !Ref PathPrefix }
            # nginx consults a resolver for NAMES; BACKEND_HOST is a literal IP, but the
            # directive must still name something valid — the VPC resolver, not Docker's
            # embedded 127.0.0.11 which does not exist on Fargate.
            - { Name: RESOLVER, Value: "169.254.169.253" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: "neobank-${EnvironmentName}-LogGroup"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Sub "${ServiceName}-ui"

  Service:
    Type: AWS::ECS::Service
    # The rule must exist before the service registers targets against the group.
    DependsOn: ListenerRule
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !ImportValue
        Fn::Sub: "neobank-${EnvironmentName}-ClusterArn"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: true
      # Spring Boot on half a vCPU takes 60-90s; a shorter grace period fails slow deploys.
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        MinimumHealthyPercent: 0     # one task per slot: it must go down before it comes up
        MaximumPercent: 200
        # Without this, a task that will never become healthy leaves ECS retrying and
        # CloudFormation waiting for HOURS before it rolls back. With it, a broken push costs
        # minutes and reverts to the last good task definition.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # ImportValue returns a comma string; the subnet list wants a real list.
          Subnets: !Split
            - ","
            - !ImportValue
                Fn::Sub: "neobank-${EnvironmentName}-SubnetIds"
          SecurityGroups:
            - !ImportValue
                Fn::Sub: "neobank-${EnvironmentName}-TaskSgId"
          # Public subnets + public IPs: what lets a task pull from ghcr.io without a NAT
          # gateway. Inbound is still closed to everything but the ALB.
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt DiscoveryService.Arn

Outputs:
  ServiceArn:
    Value: !Ref Service
  DiscoveryName:
    Description: How other slots address this one.
    Value: !Sub
      - "${ServiceName}.${NsName}"
      - NsName: !ImportValue
          Fn::Sub: "neobank-${EnvironmentName}-NamespaceName"
  Url:
    Description: How a browser reaches this slot (append to the ALB address).
    Value: !If [HasPathPrefix, !Sub "${PathPrefix}/", "/"]
